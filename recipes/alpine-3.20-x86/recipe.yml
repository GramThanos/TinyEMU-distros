# Alpine Linux 3.20 (i686) — with OpenRC and basic utilities, on a virtio-block disk.
# Built by: scripts/build.sh alpine-3.20-x86
# (recipes/alpine-3.20-x86-lite is the same distro with no init: a bare root shell.)
name: alpine-3.20-x86
description: Alpine Linux 3.20 (i686) with OpenRC, networking and basic utilities.
arch: x86                         # x86 | riscv32 | riscv64 (framework is arch-ready)
backend: alpine                   # alpine | debian | buildroot

rootfs:
  version: "3.20.3"
  mirror: https://dl-cdn.alpinelinux.org/alpine
  # tarball name under $mirror/v3.20/releases/$arch/
  minirootfs: alpine-minirootfs-3.20.3-x86.tar.gz
  size_mb: 192                    # ext2 image size (mke2fs -d)
  packages:                       # via a chroot'd apk at build time
    - alpine-base                 # openrc, busybox-openrc, mdev, alpine-conf
    - ifupdown-ng                 # the networking service (DHCP through udhcpc)
    - python3
    - nano
    - less
    - curl
    - htop
  # setup.sh (next to this file) then enables the OpenRC services and unlocks root.

kernel:
  source: build                   # build | prebuilt | buildroot
  version: "6.12.109"             # built from kernel.org (v6.x LTS) for source: build

disk:
  mode: block                     # block (drive0 chunked) | 9p (fs0)
  block_size_kb: 512               # chunk size; must match chunk.py -b
  compression: gzip               # blk*.bin.gz; needs a 2026-11+ TinyEMU (none: raw .bin)

vm:
  machine: pc
  memory_mb: 128
  # No init=: the kernel runs /sbin/init (busybox), which starts OpenRC and a
  # root autologin on hvc0 (overlay/etc/inittab).
  # No loglevel=: the kernel prints its boot log on hvc0, so a slow boot shows
  # progress from the first second (the -lite recipes keep loglevel=1, quiet).
  cmdline: "console=hvc0 root=/dev/vda rw"
