# Debian 13 "trixie" (riscv64) — with sysvinit and basic utilities, on a virtio-block disk.
# Built by: scripts/build.sh debian-13-riscv64
# (recipes/debian-13-riscv64-lite is the same distro with no init: a bare root shell.)
#
# Debian 13, not 12: riscv64 became an official Debian architecture with trixie.
name: debian-13-riscv64
description: Debian 13 trixie (riscv64) with sysvinit, networking and basic utilities.
arch: riscv64
backend: debian

rootfs:
  # The official riscv64/debian:trixie-slim image (Debian 13.7, debuerreotype
  # build of 2026-11-04), pinned by its single layer's digest: see
  # https://github.com/debuerreotype/docker-debian-artifacts/tree/d6c395f6ddd3c6e0ec727e195e3ff5cf640e1f0a/trixie/slim
  # (oci/index.json names the layer). To update, take the new layer digest from
  # the dist-riscv64 branch.
  image: riscv64/debian
  digest: sha256:4b8428ae1a4b0dfd18fb4aa2bf9a6a71d7217123155666c4225a7e1b9aa074af
  size_mb: 384
  packages:                       # via a chroot'd apt-get under QEMU user mode
    # init: sysvinit, not systemd, which is far too heavy for a software CPU
    - sysvinit-core
    - login
    - e2fsprogs                   # logsave + fsck, which the boot scripts use (not essential in trixie)
    # networking: ifupdown brings eth0 up with udhcpc at boot
    - ifupdown
    - udhcpc
    - iproute2
    - iputils-ping
    - curl
    - ca-certificates
    # tools
    - procps                      # ps, top, pkill
    - htop
    - less
    - nano
    - python3
  # setup.sh (next to this file) then unlocks root.

kernel:
  source: build
  version: "6.12.109"

firmware:
  opensbi: "1.6"
  sha256: d11702103f177a2914e94eec57ce5ed820296d874f6b6525c4482e55d71a3667

disk:
  mode: block
  block_size_kb: 512               # chunk size; must match chunk.py -b
  compression: gzip               # blk*.bin.gz; needs a 2026-11+ TinyEMU (none: raw .bin)

vm:
  machine: riscv64
  memory_mb: 256
  # No init=: the kernel runs /sbin/init (sysvinit), which runs the rc scripts
  # and a root autologin on hvc0 (overlay/etc/inittab).
  # No loglevel=: the kernel prints its boot log on hvc0, so a slow boot shows
  # progress from the first second (the -lite recipes keep loglevel=1, quiet).
  cmdline: "console=hvc0 root=/dev/vda rw"
